1069" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#183a31">Модальное подтверждение или запрос перемещения блокирует карту; закрытие не завершает сетевой бой.</text><text x="30" y="1100" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#183a31">* «Мой лист» — предлагаемый вход к существующему локальному листу; это не лист выбранного токена.</text><text x="30" y="1150" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#ad6736">ПРЕДЛОЖЕНИЕ UX. Существующие функции и ограничения перечислены отдельно в specification.md.</text></svg>